services:
  smokeTest:
    container_name: E2E-Test
    image: playwright-cucumber:1.0
    working_dir: /app

    volumes:
      - ./:/app
      - /app/node_modules
      - ./output:/app/output

    environment:
      BASE_URL: ${BASE_URL}
      DISPLAY: host.docker.internal:0.0

    command: tail -f /dev/null